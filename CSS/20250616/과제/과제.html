<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>위니북스 클론코딩</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <header>
                <h1 class="sr-only">위니북스</h1>
                <img src="./이미지/wenivooks-logo-2.png" alt="위니북스 로고" />
                <a href="#"
                    ><img src="./이미지/icon-Search.png" alt="검색"
                /></a>
            </header>
            <main>
                <article>
                    <div class="article-box">
                        <img
                            src="./이미지/main-banner-img.png"
                            alt="배너 이미지"
                        />
                        <p class="para1">위니북스 새/소/식</p>
                        <p class="para2">신규 온라인 강의 출시!</p>
                    </div>
                </article>
                <section class="content-container">
                    <div class="content-box">
                        <img
                            src="./이미지/견고한파이썬.png"
                            alt="견고한 파이썬"
                        />
                        <div class="explain-box">
                            <p>주식회사 위니브 | 출판사 골든래빗</p>
                            <h3>파이썬 부트캠프</h3>
                            <p>24,000원</p>
                            <p>
                                이 아이에게 한글과 영어 단어를 가르치고 싶어
                                문에는 문, door라고 포스트잇을 붙여놓았어요.
                                변수는 이 포스트잇과 비슷합니다. 담겨져 있는
                                실체는 변하지 않아요.
                            </p>
                            <button>Web-book</button>
                            <button>온라인 강의</button>
                        </div>
                    </div>
                </section>
            </main>
            <footer>
                <img src="./이미지/wenivooks-logo-2.png" alt="위니브로고" />
                <p>Copyright &copy; 2023 WENIV All RIghts Reserved</p>
                <div class="img-box">
                    <img src="./이미지/icon-Home.png" alt="" />
                </div>
                <div class="img-box">
                    <img src="./이미지/icon-infrean.png" alt="" />
                </div>
                <div class="img-box">
                    <img src="./이미지/icon-youtube.png" alt="" />
                </div>
                <div class="img-box">
                    <img src="./이미지/icon-naver.png" alt="" />
                </div>
                <div class="img-box">
                    <img src="./이미지/icon-insta.png" alt="" />
                </div>
            </footer>
        </div>
    </body>
</html>
