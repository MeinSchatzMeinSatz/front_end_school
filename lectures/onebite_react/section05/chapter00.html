<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자바스크립트의 화면 업데이트 예제</title>
  </head>
  <body>
    <button onclick="onClick()">리스트 추가하기</button>
    <ul id="ul"></ul>
    <script>
      // 실습 1

      // function onClick() {
      //   const $ul = document.getElementById("ul");
      //   for (let i = 0; i < 3000; i++) {
      //     $ul.innerHTML += `<li>${i}</li>`;
      //   }
      // }
      // 이런 방식은 3000번의 DOM 수정을 발생시킨다.(성능이 굉장히 악화)
      // 이렇게 DOM을 자주 사용하도록 하는 건 바람직하지 못하다.

      // 실습 2

      function onClick() {
        const $ul = document.getElementById("ul");
        let list = "";

        for (let i = 0; i < 3000; i++) {
          list += `<li>${i}</li>`;
        }

        $ul.innerHTML = list;
      }
      // 이 방법은 DOM을 딱 한 번만 수정한다.

      // 하지만 복잡한 대규모 서비스에서는 이런 방식이 굉장히 힘든 것. => React는 이 과정을 자동으로 해준다. (Virtual DOM)
    </script>
  </body>
</html>
