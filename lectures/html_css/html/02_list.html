<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>목록을 표현하는 태그</title>
    <link
      rel="stylesheet"
      href="https://showcases.yalco.kr/html-css/01-04/05.css"
    />
  </head>
  <body>
    <h1>목록을 표현하는 태그</h1>
    <h2>수련회 준비물(ul태그로 만들기)</h2>
    <ul>
      <li>이틀치 옷</li>
      <li>세면도구</li>
      <li>수건</li>
      <li>
        학습도구
        <ul>
          <li>노트북</li>
          <li>필기구</li>
          <li>교재</li>
        </ul>
      </li>
    </ul>

    <h2>계란볶음밥 만들기(ol태그로 만들기)</h2>
    <ol type="i">
      <li>
        재료준비
        <ul>
          <li>밥</li>
          <li>계란</li>
          <li>파</li>
          <li>간장</li>
        </ul>
      </li>
      <li>파를 기름에 볶기</li>
      <li>밥 넣고 볶기</li>
      <li>계란을 넣고 스크램블</li>
      <li>간장을 넣고 마저 볶아 완성</li>
    </ol>
  </body>
</html>
