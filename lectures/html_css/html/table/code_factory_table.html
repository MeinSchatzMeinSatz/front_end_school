<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>테이블 만들기 실습</title>
  </head>
  <body>
    <table border="1">
      <th>테이블</th>
      <th>만들기</th>
      <tr>
        <td>첫번째 칸</td>
        <td>두번째 칸</td>
      </tr>
      <tr>
        <td>첫번째 칸</td>
        <td>두번째 칸</td>
      </tr>
    </table>
    <table
      border="1"
      bordercolor="blue"
      width="500"
      height="300"
      align="center"
    >
      <tr bgcolor="blue" align="center">
        <p><td colspan="3" span style="color: white">오늘의 수입/지출</td></p>
      </tr>
      <tr align="center" bgcolor="skybule">
        <td>내용</td>
        <td>수입</td>
        <td>지출</td>
      </tr>
      <tr>
        <td>월급!</td>
        <td>1,000,000</td>
        <td></td>
      </tr>
      <tr>
        <td>점심값</td>
        <td></td>
        <td>5,000</td>
      </tr>
      <tr>
        <td>부모님선물</td>
        <td></td>
        <td>30,000</td>
      </tr>
      <tr>
        <td rowspan="3" align="center" bgcolor="skyblue">총계</td>
        <td>수입</td>
        <td>지출</td>
      </tr>
      <tr>
        <td>1,000,000</td>
        <td>35,000</td>
      </tr>
      <tr>
        <td>남은돈</td>
        <td>965,000</td>
      </tr>
    </table>
  </body>
</html>
