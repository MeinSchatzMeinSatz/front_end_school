<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이미지 넣기</title>
  </head>
  <body>
    <!-- 절대경로 -->
    <h2>절대 경로로 가져온 이미지</h2>
    <p>가로너비: 300px</p>
    <img
      src="https://showcases.yalco.kr/html-css/01-05/coding.png"
      alt="코딩 중인 노트북"
      title="프로그래밍"
      width="300"
    />

    <!-- 상대경로 -->
    <h2>상대 경로로 가져온 이미지</h2>
    <p>세로너비: 300px</p>
    <img
      src="./images/프로그래밍_이미지.png"
      alt="코딩 중인 노트북"
      title="프로그래밍"
      height="300"
    />

    <!-- 이미지 맵 만들기 -->
    <!-- Image Map Generated by http://www.image-map.net/ -->
    <img src="./images/이미지_맵.png" usemap="#image-map" />
    <map name="image-map">
      <area
        target=""
        alt="구글"
        title="구글"
        href="https://www.google.com/"
        coords="209,211,143"
        shape="circle"
      />
      <area
        target=""
        alt="애플"
        title="애플"
        href="https://www.apple.com/kr/"
        coords="495,79,759,343"
        shape="rect"
      />
      <area
        target=""
        alt="https://www.microsoft.com/ko-kr/"
        title="https://www.microsoft.com/ko-kr/"
        href="https://www.microsoft.com/ko-kr/"
        coords="895,209,970,81,1123,81,1198,211,1127,341,972,341"
        shape="poly"
      />
    </map>
  </body>
</html>
