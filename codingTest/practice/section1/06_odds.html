<html>
  <head>
    <meta charset="UTF-8" />
    <title>문제 6: 홀수</title>
  </head>
  <body>
    <h1>홀수</h1>
    <h2>문제 설명</h2>
    <p>
      7개의 자연수가 주어질 때, 이들 중 홀수인 자연수들을 골라 그 합을 구하고,
      고른 홀수들 중 최소값을 찾는 프로그램을 작성하세요.
    </p>
    <script>
      function solution(arr) {
        let answer = [];
        let odds = arr.filter((num) => num % 2 === 1);
        let sum = 0,
          min = Number.MAX_SAFE_INTEGER;

        for (let i = 0; i < odds.length; i++) {
          (sum += odds[i]), odds[i] < min ? (min = odds[i]) : min;
        }

        answer.push(sum);
        answer.push(min);

        return answer;
      }

      arr = [12, 77, 38, 41, 53, 92, 85];
      console.log(solution(arr));
    </script>
  </body>
</html>
