<html>
  <head>
    <meta charset="UTF-8" />
    <title>1부터 N까지 합 출력하기</title>
  </head>
  <body>
    <h1>1부터 N까지 합 출력하기</h1>
    <p>
      자연수 N이 입력되면 1부터 N까지의 합을 출력하는 프로그램을 작성하세오.
    </p>
    <script>
      function solution(n) {
        let answer = 0;

        for (let i = 1; i <= n; i++) {
          answer += i;
        }

        return answer;
      }

      console.log(solution(10));
    </script>
  </body>
</html>
