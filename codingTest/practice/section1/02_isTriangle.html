<html>
  <head>
    <meta charset="UTF-8" />
    <title>출력결과</title>
  </head>
  <body>
    <h1>삼각형 판별하기</h1>
    <p>
      길이가 서로 다른 A, B, C 세 개의 막대 길이가 주어지면 이 세 막대로
      삼각형을 만들 수 있으면 "YES"를 출력하고, 만들 수 없다면 "NO"를 출력한다.
    </p>
    <script>
      function solution(a, b, c) {
        let answer = "YES",
          max;

        let sum = a + b + c; // ⭐️ 전체 길이의 합을 먼저 구하는 작업

        /*
          1. 가장 긴 막대를 구한다.
          2. 님은 두 막대의 길이의 합이 가장 긴 막대보다 큰지 구한다.
        */

        // 가장 긴 막대의 길이(max)를 구한다.
        if (a > b) max = a;
        else max = b;
        if (c > max) max = c;

        // 짧은 막대 두 개의 값을 구해야 해.
        if (sum - max < max) answer = "NO";

        return answer;
      }

      console.log(solution(1, 3, 4));
    </script>
  </body>
</html>
