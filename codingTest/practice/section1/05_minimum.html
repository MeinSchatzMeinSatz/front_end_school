  <body>
    <h1>최솟값 구하기</h1>
    <h2>문제 설명</h2>
    <p>
      7개의 숫자가 주어지면 그 숫자 중 가장 작은 수를 출력하는 프로그램을
      작성하시오
    </p>

    <script>
      function solution(arr) {
        let answer;
        answer = Math.min(...arr);
        return answer;
      }

      let arr = [5, 7, 1, 3, 2, 9, 11];
      console.log(solution(arr));
    </script>
  </body>
