<html>
  <head>
    <meta charset="UTF-8" />
    <title>최솟값 구하기</title>
  </head>
  <body>
    <h1>최솟값 구하기</h1>
    <h2>문제 설명</h2>
    <p>
      7개의 숫자가 주어지면 그 숫자 중 가장 작은 수를 출력하는 프로그램을
      작성하시오
    </p>

    <script>
      function solution(arr) {
        let answer,
          min = Number.MAX_SAFE_INTEGER;
        // 나의 풀이1)
        // answer = Math.min(...arr);

        // 답지 풀이
        for (let i = 0; i < arr.length; i++) {
          arr[i] < min ? (min = arr[i]) : min;
        }
        return min;
      }

      let arr = [5, 7, 1, 3, 2, 9, 11];
      let arr2 = [5, 6, 7, 8, 9, 10];
      console.log("arr중 최솟값은: " + solution(arr));
      console.log("arr중 최솟값은: " + solution(arr2));
    </script>
  </body>
</html>
