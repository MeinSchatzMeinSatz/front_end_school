<html>
  <head>
    <meta charset="UTF-8" />
    <title>07_10부제</title>
  </head>
  <body>
    <h1>10부제</h1>
    <h2>문제 설명</h2>
    <p>
      서울시는 6월 1일부터 교통 혼잡을 막기 위해서 자동차 10부제를 시행한다.
      자동차 10부제는 자동차 번호의 일의 자리 숫자와 날짜의 일의 자리 숫자가
      일치하면 해당 자동차의 운행을 금지하는 것이다. 예를 들어, 자동차 번호의
      일의 자리 숫자가 7이면 7일, 17일, 27일에 운행하지 못한다. 또한, 자동차
      번호의 일의 자리 숫자가 0이면 10일, 20일, 30일에 운행하지 못한다.
    </p>
    <script>
      function solution(day, arr) {
        let answer = 0;

        for (let i = 0; i < arr.length; i++) {
          let first_num = arr[i] % 10;

          first_num === day ? (answer += 1) : answer;
        }

        return answer;
      }

      arr = [25, 23, 11, 47, 53, 17, 33];
      console.log(solution(3, arr));
    </script>
  </body>
</html>
