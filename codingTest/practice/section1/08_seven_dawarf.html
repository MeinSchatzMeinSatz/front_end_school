<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>08_일곱 난쟁이</title>
  </head>
  <body>
    <h1>일곱 난쟁이</h1>
    <h2>문제 설명</h2>
    <p>
      왕비를 피해 일곱 난쟁이들과 함꼐 평화롭게 생활하고 있던 백설공주에게
      위기가 찾아왔다. 일과를 마치고 돌아온 난쟁이가 일곱 명이 아닌 아홉명이었던
      것이다. 아홉명의 난쟁이는 모두 자신이 "백설 공주와 일곱 난쟁이"의
      주인공이라고 주장했다. 뛰어난 수학적 직관력을 가지고 있던 백설공주는,
      다행스럽게도 일곱 난쟁이의 키의 합이 100이 됨을 기억해 냈다. 아홉 난쟁이의
      키가 주어졌을떄, 백설 공주를 도와 일곱 난쟁이를 찾는 프로그램을
      작성하시오.
    </p>
    <script>
      function solution(arr) {
        let answer = arr;
        let sum = 0;

        for (let i = 0; i < arr.length; i++) {
          sum += arr[i];
        }

        for (let i = 0; i < arr.length; i++) {
          for (let j = i + 1; j < arr.length; j++) {
            if (sum - arr[i] - arr[j] === 100) {
              answer.filter((_, idx) => idx !== i || j);
            }
          }
        }

        return sum;
      }

      let arr = [22, 7, 21, 19, 10, 15, 25, 8, 13];
      console.log(solution(arr));
    </script>
  </body>
</html>
